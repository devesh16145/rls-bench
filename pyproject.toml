[project]
name = "rls-bench"
version = "0.1.0"
description = "A verifiable benchmark for Supabase/Postgres Row Level Security policies"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]==3.2.3",
    "pyyaml==6.0.2",
    "pydantic==2.9.2",
    "typer==0.12.5",
    "click==8.1.7",
    "httpx==0.27.2",
    "pgserver==0.1.4",
]

[dependency-groups]
dev = ["pytest==8.3.3"]

[project.scripts]
rls = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "eval", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
