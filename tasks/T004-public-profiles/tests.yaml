- name: anon_reads_all_profiles
  covers: [R1]
  as: {role: anon}
  sql: select username from profiles order by username
  expect: {rows: [[ana], [ben]]}

- name: user_without_profile_reads_all_profiles
  covers: [R1]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000003"}
  sql: select username, bio from profiles order by username
  expect: {rows: [[ana, Designer], [ben, null]]}

- name: user_creates_own_profile
  covers: [R2]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000003"}
  sql: insert into profiles (id, username) values ('00000000-0000-0000-0000-000000000003', 'cy')
  expect: {affected: 1}

- name: user_cannot_create_profile_for_someone_else
  covers: [R2]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000003"}
  sql: insert into profiles (id, username) values ('00000000-0000-0000-0000-000000000004', 'dee')
  expect: {denied: true}

- name: user_edits_own_profile
  covers: [R3]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000001"}
  sql: update profiles set bio = 'Lead designer' where id = '00000000-0000-0000-0000-000000000001'
  expect: {affected: 1}

- name: user_cannot_edit_other_profile
  covers: [R3]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000001"}
  sql: update profiles set bio = 'hacked' where id = '00000000-0000-0000-0000-000000000002'
  expect: {denied: true}

- name: user_cannot_move_profile_to_other_account
  covers: [R3]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000001"}
  sql: update profiles set id = '00000000-0000-0000-0000-000000000003' where id = '00000000-0000-0000-0000-000000000001'
  expect: {denied: true}

- name: owner_cannot_delete_own_profile
  covers: [R4]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000001"}
  sql: delete from profiles where id = '00000000-0000-0000-0000-000000000001'
  expect: {denied: true}

- name: user_cannot_delete_other_profile
  covers: [R4]
  as: {role: authenticated, sub: "00000000-0000-0000-0000-000000000001"}
  sql: delete from profiles where id = '00000000-0000-0000-0000-000000000002'
  expect: {denied: true}

- name: anon_cannot_create_profile
  covers: [R5]
  as: {role: anon}
  sql: insert into profiles (id, username) values ('00000000-0000-0000-0000-000000000003', 'cy')
  expect: {denied: true}

- name: anon_cannot_edit_profiles
  covers: [R5]
  as: {role: anon}
  sql: update profiles set bio = 'anon'
  expect: {denied: true}

- name: service_role_sees_all_profiles
  covers: [R6]
  as: {role: service_role}
  sql: select count(*) from profiles
  expect: {rows: [[2]]}

- name: client_upserts_own_existing_profile
  covers: [R2, R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: upsert
    table: profiles
    values: {id: 00000000-0000-0000-0000-000000000001, username: ana, bio: Hi}
    on_conflict: [id]
    returning: true
  expect: {affected: 1}

- name: client_upserts_new_own_profile
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: upsert
    table: profiles
    values: {id: 00000000-0000-0000-0000-000000000003, username: cy, bio: null}
    on_conflict: [id]
    returning: true
  expect: {affected: 1}

- name: client_cannot_upsert_over_someone_elses_profile
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: upsert
    table: profiles
    values: {id: 00000000-0000-0000-0000-000000000002, username: ben, bio: hacked}
    on_conflict: [id]
  expect: {denied: true}

- name: client_anon_cannot_upsert_profile
  covers: [R5]
  as: {role: anon}
  client:
    op: upsert
    table: profiles
    values: {id: 00000000-0000-0000-0000-000000000003, username: cy, bio: null}
    on_conflict: [id]
  expect: {denied: true}
