- name: client_creates_org_and_reads_it_back
  covers: [R1, R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: orgs
    values: {name: Initech}
    returning: true
  expect: {affected: 1}

- name: cannot_create_org_for_someone_else
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: orgs
    values: {name: Spoof, created_by: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {denied: true}

- name: creator_becomes_owner_of_new_org
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: insert into orgs (name) values ('Initech'); insert into org_members (org_id, user_id, role) values (3, '00000000-0000-0000-0000-000000000004', 'owner') returning org_id, user_id, role
  expect:
    rows:
    - [3, 00000000-0000-0000-0000-000000000004, owner]

- name: creator_cannot_make_someone_else_first_owner
  covers: [R2, R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: insert into orgs (name) values ('Initech'); insert into org_members (org_id, user_id, role) values (3, '00000000-0000-0000-0000-000000000001', 'owner')
  expect: {denied: true}

