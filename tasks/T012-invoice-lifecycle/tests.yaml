- name: creator_reads_own_invoices
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from invoices order by id
  expect:
    rows:
    - [1]
    - [2]

- name: finance_reads_every_invoice
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from invoices order by id
  expect:
    rows:
    - [1]
    - [2]
    - [3]
    - [4]

- name: outsider_reads_no_invoices
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select id from invoices
  expect: {count: 0}

- name: client_creates_draft_and_reads_it_back
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: invoices
    values: {customer: Hooli, amount: 40}
    returning: true
  expect: {affected: 1}

- name: cannot_create_invoice_as_someone_else
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: invoices
    values: {customer: Hooli, amount: 40, created_by: 00000000-0000-0000-0000-000000000001}
  expect: {denied: true}

- name: cannot_create_invoice_already_sent
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: invoices
    values: {customer: Hooli, amount: 40, status: sent}
  expect: {denied: true}

- name: creator_edits_draft
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: invoices
    values: {customer: Acme Corp, amount: 120, status: draft}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

