- name: user_reads_own_settings
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select user_id, timezone from user_settings order by user_id
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001, Europe/Lisbon]

- name: user_without_row_reads_nothing
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select user_id from user_settings
  expect: {count: 0}

- name: first_save_creates_row
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: upsert
    table: user_settings
    values: {user_id: 00000000-0000-0000-0000-000000000003, timezone: America/Lima, weekly_goal: 4, reminders_enabled: true}
    on_conflict: [user_id]
    returning: true
  expect: {affected: 1}

- name: later_save_updates_row
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: upsert
    table: user_settings
    values: {user_id: 00000000-0000-0000-0000-000000000001, timezone: Europe/Paris, weekly_goal: 6, reminders_enabled: true}
    on_conflict: [user_id]
    returning: true
  expect: {affected: 1}

- name: cannot_save_over_someone_elses_row
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: upsert
    table: user_settings
    values: {user_id: 00000000-0000-0000-0000-000000000002, timezone: UTC, weekly_goal: 1, reminders_enabled: true}
    on_conflict: [user_id]
    returning: false
  expect: {denied: true}

- name: cannot_create_row_for_someone_else
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: user_settings
    values: {user_id: 00000000-0000-0000-0000-000000000003, timezone: UTC, weekly_goal: 3, reminders_enabled: true}
    returning: false
  expect: {denied: true}

- name: cannot_update_someone_elses_row
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: user_settings
    values: {weekly_goal: 1}
    match: {user_id: 00000000-0000-0000-0000-000000000002}
    returning: false
  expect: {denied: true}

- name: cannot_move_row_to_another_user
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: user_settings
    values: {user_id: 00000000-0000-0000-0000-000000000003}
    match: {user_id: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

- name: user_deletes_own_row
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: user_settings
    match: {user_id: 00000000-0000-0000-0000-000000000001}
  expect: {affected: 1}

- name: user_cannot_delete_someone_elses_row
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: user_settings
    match: {user_id: 00000000-0000-0000-0000-000000000002}
  expect: {denied: true}

- name: anon_sees_no_settings
  covers: [R4]
  as: {role: anon}
  sql: select * from user_settings
  expect: {denied: true}

- name: anon_cannot_save_settings
  covers: [R4]
  as: {role: anon}
  client:
    op: upsert
    table: user_settings
    values: {user_id: 00000000-0000-0000-0000-000000000003, timezone: UTC, weekly_goal: 3, reminders_enabled: true}
    on_conflict: [user_id]
    returning: false
  expect: {denied: true}

- name: service_role_sees_all_settings
  covers: [R5]
  as: {role: service_role}
  sql: select count(*) from user_settings
  expect:
    rows:
    - [2]
