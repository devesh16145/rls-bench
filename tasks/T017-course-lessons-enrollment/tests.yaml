- name: instructor_creates_course
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: courses
    values: {id: 5, instructor_id: 00000000-0000-0000-0000-000000000001, title: Window functions, is_published: false}
    returning: true
  expect: {affected: 1}

- name: cannot_create_course_for_another_instructor
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: courses
    values: {id: 6, instructor_id: 00000000-0000-0000-0000-000000000004, title: Spoof, is_published: true}
    returning: false
  expect: {denied: true}

- name: instructor_publishes_own_course
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: courses
    values: {is_published: true}
    match: {id: 2}
    returning: true
  expect: {affected: 1}

- name: instructor_cannot_edit_other_course
