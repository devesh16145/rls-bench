- name: anon_reads_published_courses
  covers: [R1]
  as: {role: anon}
  sql: select id from courses order by id
  expect:
    rows:
    - [1]
    - [3]

- name: instructor_reads_own_unpublished_course
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from courses order by id
  expect:
    rows:
    - [1]
    - [2]
    - [3]

