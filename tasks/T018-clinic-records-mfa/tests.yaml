- name: patient_reads_own_records
  covers: [R1]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {aal: aal1}
  sql: select id from records order by id
  expect:
    rows:
    - [1]
    - [2]

