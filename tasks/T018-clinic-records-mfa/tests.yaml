    claims:
      aal: aal2
      user_metadata: {role: doctor}
  sql: select id from records where patient_id = 1
  expect: {count: 0}

- name: anon_sees_no_records
  covers: [R7]
  as: {role: anon}
  sql: select * from records
  expect: {denied: true}

- name: service_role_sees_all_records
  covers: [R8]
  as: {role: service_role}
  sql: select count(*) from records
  expect:
    rows:
    - [3]
