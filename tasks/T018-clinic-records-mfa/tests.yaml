- name: doctor_with_mfa_adds_record
  covers: [R3]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000003
    claims: {aal: aal2}
  client:
    op: insert
    table: records
    values: {patient_id: 1, author_id: 00000000-0000-0000-0000-000000000003, note: Results normal}
    returning: true
  expect: {affected: 1}

- name: doctor_without_mfa_cannot_add_record
  covers: [R3]
