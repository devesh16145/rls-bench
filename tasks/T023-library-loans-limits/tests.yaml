- name: member_sees_catalogue
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select count(*) from books
  expect:
    rows:
    - [5]

- name: anon_cannot_see_catalogue
  covers: [R1, R7]
  as: {role: anon}
  sql: select * from books
  expect: {denied: true}

- name: member_sees_own_loans
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from loans order by id
  expect:
    rows:
    - [1]
    - [2]

- name: librarian_sees_every_loan
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select count(*) from loans
  expect:
    rows:
    - [6]

- name: member_borrows_free_book
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: insert
    table: loans
    values: {book_id: 4, borrower_id: 00000000-0000-0000-0000-000000000003}
    returning: true
  expect: {affected: 1}

