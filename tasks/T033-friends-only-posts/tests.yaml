- name: friend_reads_friends_posts
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from posts order by id
  expect:
    rows:
    - [1]
    - [2]
    - [4]
    - [6]

