- name: user_writes_post
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: posts
    values: {author_id: 00000000-0000-0000-0000-000000000001, body: Hi friends, audience: friends}
    returning: true
  expect: {affected: 1}

- name: user_cannot_post_as_someone_else
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: posts
    values: {author_id: 00000000-0000-0000-0000-000000000002, body: spoof, audience: public}
    returning: false
  expect: {denied: true}

