- name: owner_reads_own_contracts
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from contracts order by id
  expect:
    rows:
    - [1]
    - [2]

- name: shared_user_reads_shared_contract
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from contracts order by id
  expect:
    rows:
    - [1]

- name: outsider_reads_no_contracts
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select id from contracts
  expect: {count: 0}

- name: owner_renames_contract
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: contracts
    values: {title: NDA with Acme (signed)}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: shared_user_cannot_rename_contract
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: update
    table: contracts
    values: {title: x}
    match: {id: 1}
    returning: false
  expect: {denied: true}

