- name: user_sees_restaurants
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select count(*) from restaurants
  expect:
    rows:
    - [2]

- name: guest_sees_own_reservations
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from reservations order by id
  expect:
    rows:
    - [1]
    - [2]

- name: staff_sees_restaurant_reservations
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from reservations order by id
  expect:
    rows:
    - [1]
    - [2]
    - [3]

- name: other_staff_sees_only_own_restaurant
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select id from reservations order by id
  expect:
    rows:
    - [4]

- name: guest_books_future_table
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: reservations
    values: {restaurant_id: 2, user_id: 00000000-0000-0000-0000-000000000001, reserved_for: '2099-08-15 20:00+00', party_size: 2}
    returning: true
  expect: {affected: 1}

- name: guest_cannot_book_in_the_past
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: reservations
    values: {restaurant_id: 2, user_id: 00000000-0000-0000-0000-000000000001, reserved_for: '2020-01-01 20:00+00', party_size: 2}
    returning: false
  expect: {denied: true}

- name: guest_cannot_book_for_someone_else
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: reservations
    values: {restaurant_id: 2, user_id: 00000000-0000-0000-0000-000000000002, reserved_for: '2099-08-15 20:00+00', party_size: 2}
    returning: false
  expect: {denied: true}

- name: guest_cannot_book_as_seated
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: reservations
    values: {restaurant_id: 2, user_id: 00000000-0000-0000-0000-000000000001, reserved_for: '2099-08-15 20:00+00', party_size: 2, status: seated}
    returning: false
  expect: {denied: true}

- name: guest_cancels_future_booking
  covers: [R3]
