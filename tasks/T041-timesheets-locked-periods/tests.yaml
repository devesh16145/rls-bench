  expect: {denied: true}

- name: payroll_import_writes_into_locked_period
  covers: [R6]
  as: {role: service_role}
  sql: insert into time_entries (user_id, project_id, period_id, worked_on, hours, note) values ('00000000-0000-0000-0000-000000000002', 2, 1, '2020-01-31', 2, 'payroll correction') returning id
  expect: {affected: 1}

- name: payroll_import_corrects_locked_entry
  covers: [R6]
  as: {role: service_role}
  sql: update time_entries set hours = 7 where id = 1
  expect: {affected: 1}
