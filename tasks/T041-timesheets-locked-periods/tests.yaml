- name: user_sees_own_entries
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from time_entries order by id
  expect:
    rows:
    - [1]
    - [2]

- name: other_user_sees_only_own_entries
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from time_entries order by id
  expect:
    rows:
    - [3]

- name: user_sees_assigned_projects
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from projects order by id
  expect:
    rows:
    - [2]

- name: user_sees_all_periods
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select count(*) from periods
  expect:
    rows:
    - [2]

- name: user_logs_time
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: time_entries
    values: {user_id: 00000000-0000-0000-0000-000000000001, project_id: 1, period_id: 2, worked_on: '2030-01-12', hours: 4, note: dev}
    returning: true
  expect: {affected: 1}

- name: user_cannot_log_to_unassigned_project
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: time_entries
    values: {user_id: 00000000-0000-0000-0000-000000000001, project_id: 3, period_id: 2, worked_on: '2030-01-12', hours: 4, note: dev}
    returning: false
  expect: {denied: true}

- name: user_cannot_log_for_someone_else
  covers: [R2]
