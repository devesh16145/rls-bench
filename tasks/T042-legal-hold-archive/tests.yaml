- name: owner_sees_own_files
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from files order by id
  expect:
    rows:
    - [1]
    - [2]

- name: admin_sees_every_file
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from files order by id
  expect:
    rows:
    - [1]
    - [2]
    - [3]

- name: user_sees_only_own_files
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from files order by id
  expect:
    rows:
    - [3]

- name: user_uploads_file
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: files
    values: {owner_id: 00000000-0000-0000-0000-000000000001, name: notes.md}
    returning: true
  expect: {affected: 1}

- name: user_cannot_upload_for_someone_else
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: files
    values: {owner_id: 00000000-0000-0000-0000-000000000002, name: x}
    returning: false
  expect: {denied: true}

- name: owner_renames_file
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: files
    values: {name: q3-forecast-final.xlsx}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: owner_deletes_file
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: files
    match: {id: 1}
  expect: {affected: 1}

