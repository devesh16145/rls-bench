- name: anon_sees_no_files
  covers: [R6]
  as: {role: anon}
  sql: select * from files
  expect: {denied: true}

- name: service_role_lifts_hold
  covers: [R7]
  as: {role: service_role}
  sql: update files set legal_hold = false where id = 2
  expect: {affected: 1}
