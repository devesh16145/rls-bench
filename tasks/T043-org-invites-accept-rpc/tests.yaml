  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {email: ada@example.com}
  client:
    op: insert
    table: invites
    values: {token: tok-x3, org_id: 1, email: eve@example.com, role: member, expires_at: '2099-01-01', invited_by: 00000000-0000-0000-0000-000000000001, accepted_at: '2020-01-01'}
    returning: false
  expect: {denied: true}

- name: admin_cannot_create_expired_invite
  covers: [R2]
  as:
