- name: member_sees_own_orgs
  covers: [R1]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000002
    claims: {email: bob@example.com}
  sql: select id from orgs order by id
  expect:
    rows:
    - [1]
    - [2]

- name: member_sees_org_members
  covers: [R1]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {email: ada@example.com}
  sql: select user_id from org_members order by user_id
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001]
    - [00000000-0000-0000-0000-000000000002]

- name: outsider_sees_no_orgs
  covers: [R1]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000003
    claims: {email: cal@example.com}
  sql: select id from orgs
  expect: {count: 0}

- name: admin_sees_org_invites
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {email: ada@example.com}
  sql: select count(*) from invites
  expect:
    rows:
    - [4]

- name: admin_of_other_org_sees_only_its_invites
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000002
    claims: {email: bob@example.com}
  sql: select token from invites order by token
  expect:
    rows:
    - [tok-org2]

- name: invitee_cannot_read_invites
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000003
    claims: {email: cal@example.com}
  sql: select token from invites
  expect: {denied: true}

- name: admin_creates_invite
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {email: ada@example.com}
  client:
    op: insert
    table: invites
    values: {token: tok-new, org_id: 1, email: eve@example.com, role: member, expires_at: '2099-01-01', invited_by: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {affected: 1}

- name: admin_cannot_invite_to_other_org
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {email: ada@example.com}
  client:
    op: insert
    table: invites
    values: {token: tok-x1, org_id: 2, email: eve@example.com, role: member, expires_at: '2099-01-01', invited_by: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

