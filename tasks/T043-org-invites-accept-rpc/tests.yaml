    claims: {email: bob@example.com}
  client:
    op: insert
    table: invites
    values: {token: tok-x2, org_id: 1, email: eve@example.com, role: member, expires_at: '2099-01-01', invited_by: 00000000-0000-0000-0000-000000000002}
    returning: false
  expect: {denied: true}

