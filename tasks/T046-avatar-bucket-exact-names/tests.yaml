- name: anon_reads_avatars
  covers: [R1]
  as: {role: anon}
  sql: select name from storage.objects where bucket_id = 'avatars' order by name
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001.png]
    - [00000000-0000-0000-0000-000000000002.jpg]

- name: user_cannot_read_private_bucket
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select name from storage.objects where bucket_id = 'docs'
  expect: {count: 0}

- name: user_uploads_own_jpg
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: storage.objects
    values: {bucket_id: avatars, name: 00000000-0000-0000-0000-000000000001.jpg, owner: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {affected: 1}

- name: user_replaces_own_avatar
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: storage.objects
    values: {created_at: '2020-02-01'}
    match: {bucket_id: avatars, name: 00000000-0000-0000-0000-000000000001.png}
    returning: true
  expect: {affected: 1}

- name: user_cannot_upload_someone_elses_name
  covers: [R2]
