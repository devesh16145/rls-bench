- name: user_sees_all_rides
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select count(*) from rides
  expect:
    rows:
    - [3]

- name: user_offers_ride
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: rides
    values: {id: 4, driver_id: 00000000-0000-0000-0000-000000000004, from_city: Goa, to_city: Pune, departs_at: '2099-05-01 06:00+00', seats: 3}
    returning: true
  expect: {affected: 1}

- name: user_cannot_edit_someone_elses_ride
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: update
    table: rides
    values: {seats: 9}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: passenger_sees_own_bookings
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select ride_id from ride_bookings order by ride_id
  expect:
    rows:
    - [1]
    - [3]

- name: driver_sees_bookings_on_own_rides
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select ride_id, passenger_id from ride_bookings order by ride_id, passenger_id
  expect:
    rows:
    - [1, 00000000-0000-0000-0000-000000000002]
    - [1, 00000000-0000-0000-0000-000000000003]

