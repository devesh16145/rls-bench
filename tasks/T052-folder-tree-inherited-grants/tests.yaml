- name: user_sees_own_grants
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000005}
  sql: select folder_id, user_id from folder_grants order by folder_id
  expect:
    rows:
    - [3, 00000000-0000-0000-0000-000000000005]

- name: owner_sees_grants_on_own_tree
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select count(*) from folder_grants
  expect:
    rows:
    - [4]

- name: anon_sees_no_documents
  covers: [R5]
  as: {role: anon}
  sql: select * from documents
  expect: {denied: true}

- name: service_role_sees_all_documents
  covers: [R6]
  as: {role: service_role}
  sql: select count(*) from documents
  expect:
    rows:
    - [5]
