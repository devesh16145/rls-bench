- name: editor_adds_document
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: documents
    values: {folder_id: 4, title: Q3 campaign}
    returning: true
  expect: {affected: 1}

- name: edit_grant_inherits_to_subfolder
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: documents
    values: {folder_id: 6, title: Diwali sale}
    returning: true
  expect: {affected: 1}

- name: reader_cannot_add_document
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: insert
    table: documents
    values: {folder_id: 2, title: x}
    returning: false
  expect: {denied: true}

- name: reader_cannot_edit_inherited_document
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: documents
    values: {title: x}
    match: {id: 3}
    returning: false
  expect: {denied: true}

- name: editor_cannot_move_document_into_read_only_folder
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: update
    table: documents
    values: {folder_id: 2}
    match: {id: 4}
    returning: false
  expect: {denied: true}

- name: editor_deletes_document
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: delete
    table: documents
    match: {id: 4}
  expect: {affected: 1}

