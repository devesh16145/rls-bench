- name: owner_reads_whole_tree
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from folders order by id
  expect:
    rows:
    - [1]
    - [2]
    - [3]
    - [4]
    - [6]

- name: read_grant_inherits_to_subfolder
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from folders order by id
  expect:
    rows:
    - [2]
    - [3]

- name: grant_reader_reads_documents_below
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
