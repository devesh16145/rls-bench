- name: user_reads_own_notifications
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from notifications order by id
  expect:
    rows:
    - [1]
    - [2]

- name: user_cannot_read_someone_elses_notification
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from notifications where id = 3
  expect: {count: 0}

- name: user_marks_notification_read
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: notifications
    values: {read_at: '2020-02-01'}
    match: {id: 1}
    returning: false
  expect: {affected: 1}

- name: user_marks_notification_unread
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: notifications
    values: {read_at: null}
    match: {id: 2}
    returning: false
  expect: {affected: 1}

- name: user_cannot_edit_notification_text
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: notifications
    values: {title: You won a prize}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: user_cannot_mark_someone_elses_notification
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: notifications
    values: {read_at: '2020-02-01'}
    match: {id: 3}
    returning: false
  expect: {denied: true}

- name: user_dismisses_own_notification
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: notifications
    match: {id: 2}
  expect: {affected: 1}

- name: user_cannot_dismiss_someone_elses_notification
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: notifications
    match: {id: 3}
  expect: {denied: true}

- name: user_cannot_create_own_notification
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: notifications
    values: {user_id: 00000000-0000-0000-0000-000000000001, title: 'Admin: you are verified'}
    returning: false
  expect: {denied: true}

- name: user_cannot_create_notification_for_someone_else
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: notifications
    values: {user_id: 00000000-0000-0000-0000-000000000002, title: Reset your password here}
    returning: false
  expect: {denied: true}

- name: anon_sees_no_notifications
  covers: [R4]
  as: {role: anon}
  sql: select * from notifications
  expect: {denied: true}

- name: service_role_sees_all_notifications
  covers: [R5]
  as: {role: service_role}
  sql: select count(*) from notifications
  expect:
    rows:
    - [3]
