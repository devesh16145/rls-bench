- name: user_sees_providers
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select count(*) from providers
  expect:
    rows:
    - [2]

- name: patient_sees_open_future_and_own_slots
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from slots order by id
  expect:
    rows:
    - [1]
    - [2]
    - [5]

- name: other_patient_sees_own_booking_not_others
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select id from slots order by id
  expect:
    rows:
    - [1]
    - [4]
    - [5]

- name: patient_cannot_see_past_open_slot
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from slots where id = 3
  expect: {count: 0}

- name: provider_sees_own_slots_and_bookings
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id, booked_by from slots where provider_id = '00000000-0000-0000-0000-000000000001' order by id
  expect:
    rows:
    - [1, null]
    - [2, 00000000-0000-0000-0000-000000000003]
    - [3, null]

- name: patient_books_open_slot
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: slots
    values: {booked_by: 00000000-0000-0000-0000-000000000003}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: patient_cannot_book_for_someone_else
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: slots
    values: {booked_by: 00000000-0000-0000-0000-000000000004}
    match: {id: 5}
    returning: false
  expect: {denied: true}

- name: patient_cannot_take_someone_elses_slot
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: slots
    values: {booked_by: 00000000-0000-0000-0000-000000000003}
    match: {id: 4}
    returning: false
  expect: {denied: true}

- name: patient_cannot_book_past_slot
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: slots
    values: {booked_by: 00000000-0000-0000-0000-000000000003}
    match: {id: 3}
    returning: false
  expect: {denied: true}

- name: patient_cancels_own_booking
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: slots
    values: {booked_by: null}
    match: {id: 2}
    returning: false
  expect: {affected: 1}

- name: patient_cannot_cancel_someone_elses_booking
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: slots
    values: {booked_by: null}
    match: {id: 4}
    returning: false
  expect: {denied: true}

- name: patient_cannot_move_slot_time
  covers: [R5]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: slots
    values: {starts_at: '2099-01-01 08:00+00'}
    match: {id: 2}
    returning: false
  expect: {denied: true}

- name: provider_cannot_create_slot
  covers: [R5]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: slots
    values: {id: 9, provider_id: 00000000-0000-0000-0000-000000000001, starts_at: '2099-03-01 09:00+00'}
    returning: false
  expect: {denied: true}

- name: patient_cannot_delete_slot
  covers: [R5]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: delete
    table: slots
    match: {id: 1}
  expect: {denied: true}

- name: anon_sees_no_slots
  covers: [R6]
  as: {role: anon}
  sql: select * from slots
  expect: {denied: true}

- name: service_role_sees_all_slots
  covers: [R7]
  as: {role: service_role}
  sql: select count(*) from slots
  expect:
    rows:
    - [5]
