- name: reporter_files_issue
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: insert
    table: issues
    values: {project_id: 1, title: Button misaligned, reporter_id: 00000000-0000-0000-0000-000000000003, is_confidential: false}
    returning: true
  expect: {affected: 1}

- name: reporter_files_confidential_issue
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: issues
    values: {project_id: 1, title: SQL injection in search, reporter_id: 00000000-0000-0000-0000-000000000004, is_confidential: true}
    returning: true
  expect: {affected: 1}

- name: outsider_cannot_file_issue
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000005}
  client:
    op: insert
    table: issues
    values: {project_id: 1, title: x, reporter_id: 00000000-0000-0000-0000-000000000005, is_confidential: false}
    returning: false
  expect: {denied: true}

- name: cannot_file_issue_as_someone_else
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: insert
    table: issues
    values: {project_id: 1, title: x, reporter_id: 00000000-0000-0000-0000-000000000002, is_confidential: false}
    returning: false
  expect: {denied: true}

- name: cannot_file_closed_issue
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: insert
    table: issues
    values: {project_id: 1, title: x, reporter_id: 00000000-0000-0000-0000-000000000003, is_confidential: false, status: closed}
    returning: false
  expect: {denied: true}

- name: developer_closes_issue
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
