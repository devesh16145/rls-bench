- name: user_reads_own_workouts
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from workouts order by id
  expect:
    rows:
    - [1]

- name: user_logs_workout
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: workouts
    values: {user_id: 00000000-0000-0000-0000-000000000001, performed_on: '2020-01-08', kind: cardio}
    returning: true
  expect: {affected: 1}

- name: user_cannot_log_workout_for_someone_else
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: workouts
    values: {user_id: 00000000-0000-0000-0000-000000000002, performed_on: '2020-01-08', kind: x}
    returning: false
  expect: {denied: true}

- name: user_cannot_edit_someone_elses_workout
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: workouts
    values: {kind: x}
    match: {id: 2}
    returning: false
  expect: {denied: true}

- name: user_reads_own_sets
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from workout_sets order by id
  expect:
    rows:
    - [1]
    - [2]

- name: user_cannot_read_someone_elses_sets
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from workout_sets where id = 3
  expect: {count: 0}

- name: user_adds_set_to_own_workout
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: workout_sets
    values: {workout_id: 1, exercise: Row, reps: 8, weight_kg: 40}
    returning: true
  expect: {affected: 1}

- name: user_cannot_add_set_to_someone_elses_workout
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: workout_sets
    values: {workout_id: 2, exercise: x, reps: 1, weight_kg: 1}
    returning: false
  expect: {denied: true}

- name: user_edits_own_set
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: workout_sets
    values: {reps: 6}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: user_cannot_edit_someone_elses_set
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: update
    table: workout_sets
    values: {reps: 99}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: user_cannot_move_set_to_someone_elses_workout
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: workout_sets
    values: {workout_id: 2}
    match: {id: 2}
    returning: false
  expect: {denied: true}

- name: user_deletes_own_workout
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: workouts
    match: {id: 1}
  expect: {affected: 1}

- name: anon_sees_no_sets
  covers: [R3]
  as: {role: anon}
  sql: select * from workout_sets
  expect: {denied: true}

- name: service_role_sees_all_sets
  covers: [R4]
  as: {role: service_role}
  sql: select count(*) from workout_sets
  expect:
    rows:
    - [3]
