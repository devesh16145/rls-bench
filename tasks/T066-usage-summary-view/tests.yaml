- name: user_reads_own_daily_usage
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select day, requests from api_usage order by day
  expect:
    rows:
    - ['2020-01-01', 100]
    - ['2020-01-02', 50]

- name: user_cannot_read_someone_elses_usage
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select day from api_usage where user_id = '00000000-0000-0000-0000-000000000002'
  expect: {count: 0}

- name: user_sees_own_summary
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select user_id, total_requests, active_days from usage_summary order by user_id
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001, 150, 2]

- name: other_user_sees_only_own_summary
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select user_id, total_requests, active_days from usage_summary order by user_id
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000002, 7, 1]

- name: usage_summary_has_exactly_three_columns
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select column_name from information_schema.columns where table_schema = 'public' and table_name = 'usage_summary' order by ordinal_position
  expect:
    rows:
    - [user_id]
    - [total_requests]
    - [active_days]

- name: user_cannot_change_usage
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: api_usage
    values: {requests: 0}
    match: {user_id: 00000000-0000-0000-0000-000000000001, day: '2020-01-01'}
    returning: false
  expect: {denied: true}

- name: user_cannot_add_usage
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: api_usage
    values: {user_id: 00000000-0000-0000-0000-000000000001, day: '2020-01-03', requests: 1}
    returning: false
  expect: {denied: true}

- name: anon_sees_no_summary
  covers: [R4]
  as: {role: anon}
  sql: select * from usage_summary
  expect: {denied: true}

- name: anon_sees_no_usage
  covers: [R4]
  as: {role: anon}
  sql: select * from api_usage
  expect: {denied: true}

- name: service_role_sees_every_summary
  covers: [R5]
  as: {role: service_role}
  sql: select count(*) from usage_summary
  expect:
    rows:
    - [2]
