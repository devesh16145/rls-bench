- name: resident_files_request
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: requests
    values: {unit_id: 101, created_by: 00000000-0000-0000-0000-000000000001, description: Fan not working}
    returning: true
  expect: {affected: 1}

- name: resident_cannot_file_for_other_unit
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: requests
    values: {unit_id: 102, created_by: 00000000-0000-0000-0000-000000000001, description: Fan not working}
    returning: false
  expect: {denied: true}

