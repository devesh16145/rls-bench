- name: student_starts_thread
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: insert
    table: threads
    values: {course_id: 1, title: Week 2 questions, created_by: 00000000-0000-0000-0000-000000000002}
    returning: true
  expect: {affected: 1}

