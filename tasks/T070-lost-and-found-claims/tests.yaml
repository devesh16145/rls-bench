- name: finder_approves_claim
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: claims
    values: {status: approved}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: finder_rejects_claim
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: claims
    values: {status: rejected}
    match: {id: 2}
    returning: true
  expect: {affected: 1}

- name: finder_cannot_approve_second_claim
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
