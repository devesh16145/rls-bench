    values: {status: approved}
    match: {id: 4}
    returning: false
  expect: {denied: true}

- name: claimant_cannot_approve_own_claim
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: update
    table: claims
    values: {status: approved}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: finder_cannot_change_decided_claim
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: claims
