- name: driver_sees_own_trips
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from trips order by id
  expect:
    rows:
    - [1]

- name: manager_sees_all_trips
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select count(*) from trips
  expect:
    rows:
    - [2]

