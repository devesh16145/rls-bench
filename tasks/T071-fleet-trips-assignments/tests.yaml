- name: driver_logs_covered_trip
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: insert
    table: trips
    values: {vehicle_id: 1, driver_id: 00000000-0000-0000-0000-000000000002, trip_date: '2020-01-20', km: 42}
    returning: true
  expect: {affected: 1}

