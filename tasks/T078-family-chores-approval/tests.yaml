    table: chores
    match: {id: 3}
  expect: {denied: true}

- name: other_household_parent_cannot_approve
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000005}
  client:
    op: update
    table: chores
    values: {status: approved}
    match: {id: 2}
    returning: false
  expect: {denied: true}

- name: child_cannot_become_parent
  covers: [R5]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: household_members
    values: {role: parent}
    match: {household_id: 1, user_id: 00000000-0000-0000-0000-000000000003}
    returning: false
  expect: {denied: true}

- name: anon_sees_no_chores
  covers: [R6]
  as: {role: anon}
  sql: select * from chores
  expect: {denied: true}

- name: service_role_sees_all_chores
  covers: [R7]
  as: {role: service_role}
  sql: select count(*) from chores
  expect:
    rows:
    - [4]
