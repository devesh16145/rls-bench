    table: chores
    values: {points: 0}
    match: {id: 3}
    returning: false
  expect: {denied: true}

- name: parent_cannot_delete_approved_chore
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
