- name: child_sees_household_chores
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from chores order by id
  expect:
    rows:
    - [1]
    - [2]
    - [3]

- name: other_household_sees_only_own
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000006}
  sql: select id from chores order by id
  expect:
    rows:
    - [4]

- name: member_sees_household_members
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select count(*) from household_members
  expect:
    rows:
    - [4]

- name: parent_creates_chore
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: chores
    values: {household_id: 1, title: Water the plants, assignee_id: 00000000-0000-0000-0000-000000000004, points: 5}
    returning: true
  expect: {affected: 1}

- name: parent_cannot_create_in_other_household
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: chores
    values: {household_id: 2, title: Water the plants, assignee_id: 00000000-0000-0000-0000-000000000006, points: 5}
    returning: false
  expect: {denied: true}

- name: parent_cannot_assign_chore_to_parent
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: chores
    values: {household_id: 1, title: Water the plants, assignee_id: 00000000-0000-0000-0000-000000000002, points: 5}
    returning: false
  expect: {denied: true}

- name: child_cannot_create_chore
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: insert
    table: chores
    values: {household_id: 1, title: Water the plants, assignee_id: 00000000-0000-0000-0000-000000000003, points: 100}
    returning: false
  expect: {denied: true}

- name: parent_edits_chore_points
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: update
    table: chores
    values: {points: 15}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: child_marks_chore_done
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: chores
    values: {household_id: 1, title: Make the bed, assignee_id: 00000000-0000-0000-0000-000000000003, points: 10, status: done}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: child_cannot_mark_siblings_chore
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: update
    table: chores
    values: {status: done}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: child_cannot_raise_points
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: chores
    values: {household_id: 1, title: Make the bed, assignee_id: 00000000-0000-0000-0000-000000000003, points: 100, status: done}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: child_cannot_approve_own_chore
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: chores
    values: {household_id: 1, title: Make the bed, assignee_id: 00000000-0000-0000-0000-000000000003, points: 10, status: approved}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: parent_approves_done_chore
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: chores
    values: {status: approved}
    match: {id: 2}
    returning: true
  expect: {affected: 1}

- name: parent_cannot_change_approved_chore
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
