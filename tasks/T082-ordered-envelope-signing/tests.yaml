- name: recipient_sees_own_envelopes
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from envelopes order by id
  expect:
    rows:
    - [1]
    - [3]
    - [4]

- name: recipient_sees_full_recipient_list
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select count(*) from envelope_recipients where envelope_id = 1
  expect:
    rows:
    - [3]

- name: outsider_sees_no_envelopes
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000005}
  sql: select id from envelopes
  expect: {count: 0}

- name: sender_sees_all_own_envelopes
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select count(*) from envelopes
  expect:
    rows:
    - [4]

- name: recipient_cannot_mark_signed_directly
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: update
    table: envelope_recipients
    values: {signed_at: '2020-01-05'}
    match: {envelope_id: 1, user_id: 00000000-0000-0000-0000-000000000004}
    returning: false
  expect: {denied: true}

- name: sender_cannot_complete_directly
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: envelopes
    values: {status: completed}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: next_recipient_signs
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select public.sign_envelope(1)
  expect:
    rows:
    - [sent]

- name: last_signature_completes_envelope
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select public.sign_envelope(4)
  expect:
    rows:
    - [completed]

- name: completion_is_stored
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select public.sign_envelope(4); select status from envelopes where id = 4
  expect:
    rows:
    - [completed]

- name: recipient_cannot_sign_out_of_order
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select public.sign_envelope(1)
  expect: {denied: true}

- name: recipient_cannot_sign_twice
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select public.sign_envelope(1)
  expect: {denied: true}

- name: cannot_sign_voided_envelope
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select public.sign_envelope(3)
  expect: {denied: true}

- name: outsider_cannot_sign
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000005}
  sql: select public.sign_envelope(1)
  expect: {denied: true}

- name: sender_voids_envelope
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.void_envelope(1)
  expect:
    rows:
    - [voided]

- name: recipient_cannot_void
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select public.void_envelope(1)
  expect: {denied: true}

- name: sender_cannot_void_completed_envelope
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.void_envelope(2)
  expect: {denied: true}

- name: anon_cannot_sign
  covers: [R3, R5]
  as: {role: anon}
  sql: select public.sign_envelope(1)
  expect: {denied: true}

- name: anon_sees_no_envelopes
  covers: [R5]
  as: {role: anon}
  sql: select * from envelopes
  expect: {denied: true}

- name: service_role_sees_all_recipients
  covers: [R6]
  as: {role: service_role}
  sql: select count(*) from envelope_recipients
  expect:
    rows:
    - [7]
