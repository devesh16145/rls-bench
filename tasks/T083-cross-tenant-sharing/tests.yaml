- name: recipient_sees_shares_addressed_to_it
  covers: [R4]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000003
    claims:
      app_metadata: {tenant_id: globex, role: admin}
  sql: select item_id from item_shares order by item_id
