- name: admin_shares_item
  covers: [R3]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims:
      app_metadata: {tenant_id: acme, role: admin}
  client:
    op: insert
    table: item_shares
    values: {item_id: 2, target_tenant: initech, expires_at: '2099-01-01'}
    returning: true
  expect: {affected: 1}

- name: admin_renews_expired_share
  covers: [R3]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims:
      app_metadata: {tenant_id: acme, role: admin}
  client:
    op: update
    table: item_shares
    values: {expires_at: null}
    match: {item_id: 2, target_tenant: globex}
    returning: true
  expect: {affected: 1}

- name: admin_revokes_share
  covers: [R3]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims:
      app_metadata: {tenant_id: acme, role: admin}
  client:
    op: delete
    table: item_shares
    match: {item_id: 1, target_tenant: globex}
  expect: {affected: 1}

- name: member_cannot_share
  covers: [R3]
