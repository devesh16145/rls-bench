- name: member_sees_own_and_shared_items
  covers: [R1]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000004
    claims:
      app_metadata: {tenant_id: globex, role: member}
  sql: select id from items order by id
  expect:
    rows:
    - [1]
    - [3]

- name: owner_tenant_sees_own_items
  covers: [R1]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000002
    claims:
      app_metadata: {tenant_id: acme, role: member}
  sql: select id from items order by id
  expect:
    rows:
    - [1]
    - [2]

- name: expired_share_grants_nothing
  covers: [R1]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000004
    claims:
      app_metadata: {tenant_id: globex, role: member}
  sql: select id from items where id = 2
  expect: {count: 0}

- name: user_metadata_tenant_is_ignored
  covers: [R5]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000005
    claims:
      app_metadata: {tenant_id: globex, role: member}
      user_metadata: {tenant_id: acme, role: admin}
  sql: select id from items order by id
  expect:
    rows:
    - [1]
    - [3]

- name: admin_edits_own_item
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims:
      app_metadata: {tenant_id: acme, role: admin}
  client:
    op: update
    table: items
    values: {title: Wholesale price list 2026}
    match: {id: 1}
    returning: true
  expect: {affected: 1}

- name: member_cannot_edit_item
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000002
    claims:
      app_metadata: {tenant_id: acme, role: member}
  client:
    op: update
    table: items
    values: {title: x}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: recipient_admin_cannot_edit_shared_item
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000003
    claims:
      app_metadata: {tenant_id: globex, role: admin}
  client:
    op: update
    table: items
    values: {title: x}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: admin_creates_item
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims:
      app_metadata: {tenant_id: acme, role: admin}
  client:
    op: insert
    table: items
    values: {tenant_id: acme, title: Spec sheet}
    returning: true
  expect: {affected: 1}

- name: spoofed_admin_cannot_create_item
  covers: [R5]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000005
    claims:
      app_metadata: {tenant_id: globex, role: member}
