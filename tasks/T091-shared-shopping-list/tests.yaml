- name: member_sees_household_items
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from shopping_items order by id
  expect:
    rows:
    - [1]
    - [2]
    - [3]

- name: other_household_sees_only_own
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from shopping_items order by id
  expect:
    rows:
    - [4]

- name: member_sees_household_members
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select count(*) from household_members
  expect:
    rows:
    - [2]

- name: member_adds_item
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: shopping_items
    values: {household_id: 1, name: Bread, added_by: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {affected: 1}

- name: member_cannot_add_to_other_household
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: shopping_items
    values: {household_id: 2, name: Bread, added_by: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

- name: member_cannot_add_as_someone_else
