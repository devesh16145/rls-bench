- name: anon_reads_public_profiles
  covers: [R1]
  as: {role: anon}
  sql: select user_id from profiles order by user_id
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001]

- name: member_reads_public_and_members_profiles
  covers: [R1, R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select user_id from profiles order by user_id
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001]
    - [00000000-0000-0000-0000-000000000002]

- name: owner_reads_own_private_profile
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select user_id from profiles order by user_id
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001]
    - [00000000-0000-0000-0000-000000000002]
    - [00000000-0000-0000-0000-000000000003]

- name: member_cannot_read_private_profile
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select user_id from profiles where user_id = '00000000-0000-0000-0000-000000000003'
  expect: {count: 0}

- name: user_creates_own_profile
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: profiles
    values: {user_id: 00000000-0000-0000-0000-000000000004, display_name: Dee, bio: '', visibility: members}
    returning: true
  expect: {affected: 1}

- name: user_cannot_create_profile_for_someone_else
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: profiles
    values: {user_id: 00000000-0000-0000-0000-000000000005, display_name: Eli, bio: '', visibility: members}
    returning: false
  expect: {denied: true}

- name: user_edits_own_profile
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: profiles
    values: {bio: Product designer in Pune}
    match: {user_id: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {affected: 1}

- name: user_makes_own_profile_private
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: profiles
    values: {visibility: private}
    match: {user_id: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {affected: 1}

- name: user_cannot_edit_someone_elses_profile
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: profiles
    values: {bio: x}
    match: {user_id: 00000000-0000-0000-0000-000000000002}
    returning: false
  expect: {denied: true}

- name: user_cannot_move_profile_to_someone_else
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: profiles
    values: {user_id: 00000000-0000-0000-0000-000000000005}
    match: {user_id: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

- name: anon_cannot_create_profile
  covers: [R4]
  as: {role: anon}
  client:
    op: insert
    table: profiles
    values: {user_id: 00000000-0000-0000-0000-000000000005, display_name: Eli, bio: '', visibility: members}
    returning: false
  expect: {denied: true}

- name: service_role_sees_all_profiles
  covers: [R5]
  as: {role: service_role}
  sql: select count(*) from profiles
  expect:
    rows:
    - [3]
