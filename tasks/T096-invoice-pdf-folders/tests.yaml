- name: user_reads_own_invoices
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select name from storage.objects where bucket_id = 'invoices' order by name
  expect:
    rows:
    - [00000000-0000-0000-0000-000000000001/2020-01.pdf]

- name: user_cannot_read_someone_elses_invoice
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select name from storage.objects where name = '00000000-0000-0000-0000-000000000002/2020-01.pdf'
  expect: {count: 0}

- name: user_cannot_read_unowned_object
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select name from storage.objects where name = 'misc/readme.txt'
  expect: {count: 0}

- name: user_uploads_pdf
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: storage.objects
    values: {bucket_id: invoices, name: 00000000-0000-0000-0000-000000000001/2020-02.pdf, owner: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {affected: 1}

- name: user_cannot_upload_non_pdf
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: storage.objects
    values: {bucket_id: invoices, name: 00000000-0000-0000-0000-000000000001/notes.txt, owner: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

- name: user_cannot_upload_into_someone_elses_folder
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: storage.objects
    values: {bucket_id: invoices, name: 00000000-0000-0000-0000-000000000002/fake.pdf, owner: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

- name: user_cannot_upload_with_someone_else_as_owner
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: storage.objects
    values: {bucket_id: invoices, name: 00000000-0000-0000-0000-000000000001/x.pdf, owner: 00000000-0000-0000-0000-000000000002}
    returning: false
  expect: {denied: true}

- name: user_renames_own_invoice
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: storage.objects
    values: {name: 00000000-0000-0000-0000-000000000001/2020-01-final.pdf}
    match: {name: 00000000-0000-0000-0000-000000000001/2020-01.pdf}
    returning: true
  expect: {affected: 1}

- name: user_cannot_move_invoice_into_someone_elses_folder
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: storage.objects
    values: {name: 00000000-0000-0000-0000-000000000002/gift.pdf}
    match: {name: 00000000-0000-0000-0000-000000000001/2020-01.pdf}
    returning: false
  expect: {denied: true}

- name: user_deletes_own_invoice
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: storage.objects
    match: {name: 00000000-0000-0000-0000-000000000001/2020-01.pdf}
  expect: {affected: 1}

- name: user_cannot_delete_someone_elses_invoice
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: delete
    table: storage.objects
    match: {name: 00000000-0000-0000-0000-000000000001/2020-01.pdf}
  expect: {denied: true}

- name: anon_sees_no_objects
  covers: [R4]
  as: {role: anon}
  sql: select * from storage.objects
  expect: {denied: true}

- name: service_role_sees_all_objects
  covers: [R5]
  as: {role: service_role}
  sql: select count(*) from storage.objects
  expect:
    rows:
    - [3]
