- name: reviewer_sees_only_own_reviews
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select proposal_id from reviews order by proposal_id
  expect:
    rows:
    - [2]

- name: speaker_cannot_see_reviews_before_decision
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select score from reviews
  expect: {count: 0}

- name: speaker_sees_reviews_after_decision
