  client:
    op: insert
    table: reviews
    values: {proposal_id: 3, reviewer_id: 00000000-0000-0000-0000-000000000001, score: 5, comment: Clear and useful}
    returning: false
  expect: {denied: true}

- name: reviewer_cannot_review_as_someone_else
