  client:
    op: insert
    table: reviews
    values: {proposal_id: 1, reviewer_id: 00000000-0000-0000-0000-000000000004, score: 4, comment: Clear and useful}
    returning: false
  expect: {denied: true}

- name: reviewer_cannot_review_decided_proposal
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: insert
    table: reviews
    values: {proposal_id: 2, reviewer_id: 00000000-0000-0000-0000-000000000004, score: 4, comment: Clear and useful}
    returning: false
  expect: {denied: true}

- name: reviewer_edits_own_review
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  client:
    op: update
    table: reviews
