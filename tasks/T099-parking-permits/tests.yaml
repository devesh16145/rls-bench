- name: resident_sees_unit_permits
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from permits order by id
  expect:
    rows:
    - [1]
    - [2]

- name: admin_sees_every_permit
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select count(*) from permits
  expect:
    rows:
    - [4]

- name: resident_adds_permit
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: insert into permits (unit_id, plate, valid_until) values (102, 'MH14JK3333', current_date + 30) returning id
  expect: {affected: 1}

- name: resident_cannot_add_permit_valid_too_long
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: insert into permits (unit_id, plate, valid_until) values (102, 'MH14JK3333', current_date + 800) returning id
  expect: {denied: true}

- name: resident_at_cap_cannot_add_permit
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: insert into permits (unit_id, plate, valid_until) values (101, 'MH12ZZ0000', current_date + 30) returning id
  expect: {denied: true}

- name: resident_cannot_add_permit_for_other_unit
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: insert into permits (unit_id, plate, valid_until) values (101, 'MH14JK3333', current_date + 30) returning id
  expect: {denied: true}

- name: resident_cannot_add_revoked_permit
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: insert into permits (unit_id, plate, valid_until, revoked) values (102, 'X', current_date + 30, true)
  expect: {denied: true}

- name: resident_changes_plate
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: permits
    values: {plate: MH12AB9999}
    match: {id: 1}
    returning: false
  expect: {affected: 1}

- name: resident_cannot_extend_permit
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: permits
    values: {valid_until: '2100-01-01'}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: resident_cannot_unrevoke_permit
  covers: [R3, R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: update
    table: permits
    values: {revoked: false}
    match: {id: 4}
    returning: false
  expect: {denied: true}

- name: resident_cannot_revoke_permit
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: permits
    values: {revoked: true}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: admin_revokes_permit
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: permits
    values: {revoked: true}
    match: {id: 1}
    returning: false
  expect: {affected: 1}

- name: admin_cannot_unrevoke_permit
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: update
    table: permits
    values: {revoked: false}
    match: {id: 4}
    returning: false
  expect: {denied: true}

- name: resident_cannot_delete_permit
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: permits
    match: {id: 1}
  expect: {denied: true}

- name: resident_cannot_become_admin
  covers: [R5]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: hoa_admins
    values: {user_id: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

- name: anon_sees_no_permits
  covers: [R5]
  as: {role: anon}
  sql: select * from permits
  expect: {denied: true}

- name: service_role_sees_all_permits
  covers: [R6]
  as: {role: service_role}
  sql: select count(*) from permits
  expect:
    rows:
    - [4]
