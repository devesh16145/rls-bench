- name: student_sees_own_booking_messages
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from booking_messages order by id
  expect:
    rows:
    - [1]
    - [2]

- name: other_student_sees_only_own
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from booking_messages order by id
  expect:
    rows:
    - [3]

- name: tutor_sees_all_own_booking_messages
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select count(*) from booking_messages
  expect:
    rows:
    - [3]

- name: student_sees_own_bookings
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from bookings order by id
  expect:
    rows:
    - [1]
    - [3]

- name: student_messages_confirmed_booking
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: booking_messages
    values: {booking_id: 1, sender_id: 00000000-0000-0000-0000-000000000001, body: See you at 5pm}
    returning: true
  expect: {affected: 1}

- name: tutor_messages_confirmed_booking
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  client:
    op: insert
    table: booking_messages
    values: {booking_id: 1, sender_id: 00000000-0000-0000-0000-000000000003, body: See you at 5pm}
    returning: true
  expect: {affected: 1}

- name: cannot_message_cancelled_booking
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: insert
    table: booking_messages
    values: {booking_id: 2, sender_id: 00000000-0000-0000-0000-000000000002, body: See you at 5pm}
    returning: false
  expect: {denied: true}

- name: cannot_message_unconfirmed_booking
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: booking_messages
    values: {booking_id: 3, sender_id: 00000000-0000-0000-0000-000000000001, body: See you at 5pm}
    returning: false
  expect: {denied: true}

- name: outsider_cannot_message_booking
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: insert
    table: booking_messages
    values: {booking_id: 1, sender_id: 00000000-0000-0000-0000-000000000002, body: See you at 5pm}
    returning: false
  expect: {denied: true}

- name: cannot_send_as_someone_else
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: booking_messages
    values: {booking_id: 1, sender_id: 00000000-0000-0000-0000-000000000003, body: See you at 5pm}
    returning: false
  expect: {denied: true}

- name: sender_cannot_edit_message
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: booking_messages
    values: {body: edited}
    match: {id: 1}
    returning: false
  expect: {denied: true}

- name: sender_deletes_own_message
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: booking_messages
    match: {id: 1}
  expect: {affected: 1}

- name: cannot_delete_someone_elses_message
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: delete
    table: booking_messages
    match: {id: 2}
  expect: {denied: true}

- name: student_cannot_confirm_booking
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: bookings
    values: {status: confirmed}
    match: {id: 3}
    returning: false
  expect: {denied: true}

- name: anon_sees_no_messages
  covers: [R4]
  as: {role: anon}
  sql: select * from booking_messages
  expect: {denied: true}

- name: service_role_sees_all_messages
  covers: [R5]
  as: {role: service_role}
  sql: select count(*) from booking_messages
  expect:
    rows:
    - [3]
