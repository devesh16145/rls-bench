- name: staff_sees_own_warehouse_stock
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select warehouse_id, sku, qty from stock order by warehouse_id
  expect:
    rows:
    - [1, SKU-1, 10]

- name: other_staff_sees_only_own_warehouse
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select warehouse_id, sku, qty from stock order by warehouse_id
  expect:
    rows:
    - [2, SKU-1, 3]

- name: staff_cannot_set_stock_directly
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: update
    table: stock
    values: {qty: 1000}
    match: {warehouse_id: 1, sku: SKU-1}
    returning: false
  expect: {denied: true}

- name: staff_cannot_log_transfer_directly
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: transfers
    values: {from_warehouse: 1, to_warehouse: 2, sku: SKU-1, qty: 1, moved_by: 00000000-0000-0000-0000-000000000001}
    returning: false
  expect: {denied: true}

- name: staff_transfers_stock
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.transfer_stock(1, 2, 'SKU-1', 4)
  expect:
    rows:
    - [6]

- name: destination_is_credited
  covers: [R3]
  as: {role: service_role}
  sql: 'select set_config(''request.jwt.claims'', ''{"role": "authenticated", "sub": "00000000-0000-0000-0000-000000000001"}'', true); select public.transfer_stock(1, 2, ''SKU-1'', 4); select qty from stock where warehouse_id = 2 and sku = ''SKU-1'''
  expect:
    rows:
    - [7]

- name: new_destination_row_is_created
  covers: [R3]
  as: {role: service_role}
  sql: 'select set_config(''request.jwt.claims'', ''{"role": "authenticated", "sub": "00000000-0000-0000-0000-000000000001"}'', true); select public.transfer_stock(1, 3, ''SKU-1'', 2); select qty from stock where warehouse_id = 3 and sku = ''SKU-1'''
  expect:
    rows:
    - [2]

- name: transfer_is_logged
  covers: [R3]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.transfer_stock(1, 2, 'SKU-1', 4); select from_warehouse, to_warehouse, qty from transfers order by id
  expect:
    rows:
    - [1, 2, 4]

- name: cannot_transfer_more_than_stock
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.transfer_stock(1, 2, 'SKU-1', 11)
  expect: {denied: true}

- name: cannot_transfer_negative_quantity
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.transfer_stock(1, 2, 'SKU-1', -5)
  expect: {denied: true}

- name: cannot_transfer_zero
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.transfer_stock(1, 2, 'SKU-1', 0)
  expect: {denied: true}

- name: cannot_transfer_to_same_warehouse
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.transfer_stock(1, 1, 'SKU-1', 2)
  expect: {denied: true}

- name: cannot_transfer_to_unknown_warehouse
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select public.transfer_stock(1, 9, 'SKU-1', 2)
  expect: {denied: true}

- name: other_warehouse_staff_cannot_transfer_out
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select public.transfer_stock(1, 2, 'SKU-1', 2)
  expect: {denied: true}

- name: anon_cannot_transfer
  covers: [R4, R5]
  as: {role: anon}
  sql: select public.transfer_stock(1, 2, 'SKU-1', 1)
  expect: {denied: true}

- name: anon_sees_no_stock
  covers: [R5]
  as: {role: anon}
  sql: select * from stock
  expect: {denied: true}

- name: service_role_sees_all_stock
  covers: [R6]
  as: {role: service_role}
  sql: select count(*) from stock
  expect:
    rows:
    - [2]
