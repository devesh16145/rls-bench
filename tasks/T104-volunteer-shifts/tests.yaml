- name: volunteer_sees_open_shifts
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from shifts order by id
  expect:
    rows:
    - [1]
    - [2]
    - [4]

- name: coordinator_sees_cancelled_shift_too
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select count(*) from shifts
  expect:
    rows:
    - [4]

- name: volunteer_signs_up
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  client:
    op: insert
    table: signups
    values: {shift_id: 1, volunteer_id: 00000000-0000-0000-0000-000000000001}
    returning: true
  expect: {affected: 1}

