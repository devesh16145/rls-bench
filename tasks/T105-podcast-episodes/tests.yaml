- name: anon_reads_published_episodes
  covers: [R1]
  as: {role: anon}
  sql: select id from episodes order by id
  expect:
    rows:
    - [1]
    - [4]

- name: anon_cannot_see_future_dated_episode
  covers: [R1]
  as: {role: anon}
  sql: select id from episodes where id = 2
  expect: {denied: true}

- name: anon_reads_shows
  covers: [R1]
  as: {role: anon}
  sql: select count(*) from shows
  expect:
    rows:
    - [2]

- name: listener_sees_only_published
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select id from episodes order by id
  expect:
    rows:
    - [1]
    - [4]

