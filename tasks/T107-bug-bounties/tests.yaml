- name: submitter_sees_own_submissions
  covers: [R4]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from submissions order by id
  expect:
    rows:
    - [1]
    - [3]
    - [4]

