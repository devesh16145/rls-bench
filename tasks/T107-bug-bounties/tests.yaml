- name: user_reads_bounties
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select count(*) from bounties
  expect:
    rows:
    - [3]

- name: user_posts_bounty
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: insert
    table: bounties
    values: {title: Leaky export, poster_id: 00000000-0000-0000-0000-000000000002}
    returning: true
  expect: {affected: 1}

- name: user_cannot_post_awarded_bounty
  covers: [R2]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  client:
    op: insert
    table: bounties
    values: {title: x, poster_id: 00000000-0000-0000-0000-000000000002, status: awarded, awarded_submission_id: 1}
    returning: false
  expect: {denied: true}

- name: user_cannot_post_as_other
  covers: [R2]
