- name: owner_sees_own_camera
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000001}
  sql: select id from cameras order by id
  expect:
    rows:
    - [1]

- name: grantee_sees_shared_and_own_cameras
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000002}
  sql: select id from cameras order by id
  expect:
    rows:
    - [1]
    - [2]

- name: expired_grantee_sees_nothing
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000003}
  sql: select * from cameras
  expect: {denied: true}

- name: stranger_sees_nothing
  covers: [R1]
  as: {role: authenticated, sub: 00000000-0000-0000-0000-000000000004}
  sql: select * from cameras
  expect: {denied: true}

- name: owner_reads_stream_key_after_mfa
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {aal: aal2}
  sql: select key from stream_keys where camera_id = 1
  expect:
    rows:
    - [k1]

- name: owner_cannot_read_stream_key_without_mfa
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000001
    claims: {aal: aal1}
  sql: select key from stream_keys
  expect: {denied: true}

- name: grantee_reads_shared_key_after_mfa
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000002
    claims: {aal: aal2}
  sql: select key from stream_keys order by key
  expect:
    rows:
    - [k1]
    - [k2]

- name: grantee_cannot_read_key_without_mfa
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000002
    claims: {aal: aal1}
  sql: select key from stream_keys where camera_id = 1
  expect: {denied: true}

- name: expired_grantee_cannot_read_key
  covers: [R2]
  as:
    role: authenticated
    sub: 00000000-0000-0000-0000-000000000003
    claims: {aal: aal2}
  sql: select key from stream_keys where camera_id = 1
  expect: {denied: true}

